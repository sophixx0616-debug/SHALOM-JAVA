spring.application.name=SHALOM Beauty Salon

# MySQL Database (XAMPP / MariaDB compatible)
# Tablas y datos semilla los crea la propia aplicacion (ddl-auto=update + DataInitializer).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shalom_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&createDatabaseIfNotExist=true}
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=false

# Thymeleaf
spring.thymeleaf.cache=false

# Locale
spring.web.locale=es_CO
spring.web.locale-resolver=fixed

# Server
server.port=8080

# SQL init (los datos semilla los carga DataInitializer, no scripts SQL)
spring.sql.init.mode=never

# File upload
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ---------------------------------------------------------------------------
# GOOGLE OAUTH2 (Continuar con Google)
#
# Configuracion ESTANDAR de Spring Boot (spring.security.oauth2.client.*).
# Con esto Spring Boot crea el ClientRegistrationRepository automaticamente
# a partir de estas propiedades (no hace falta ningun bean manual).
#
# Redirect URI autorizada en Google Cloud:
#   http://localhost:8080/login/oauth2/code/google
#   ({baseUrl}/login/oauth2/code/{registrationId})
#
# Si se desactiva OAuth2 (por ejemplo, dejando el client-id vacio), la aplicacion
# arranca igual: SecurityConfig detecta que no hay repositorio y omite oauth2Login.
# ---------------------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-info-authentication-method=header
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub