<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresos Estimados — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- LIBRERÍA AGREGADA: SheetJS para convertir tablas HTML a Excel -->
    <script src="https://jsdelivr.net"></script>
</head>

<body>
    <nav th:replace="~{layouts/navbar :: navbar}"></nav>
    <main>
        <div class="container-lg py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="section-title mb-0"><i class="bi bi-cash-stack"></i> Ingresos Estimados</h2>
                <div>
                    <!-- BOTÓN AGREGADO: Ejecuta la descarga en formato Excel -->
                    <button onclick="exportarIngresosAExcel()" class="btn btn-success me-2">
                        <i class="bi bi-file-earmark-excel"></i> Descargar Excel
                    </button>
                    <a th:href="@{/dashboard}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i>
                        Volver</a>
                </div>
            </div>
            <div class="card dashboard-card mb-4">
                <div class="card-body text-center p-4">
                    <h3 class="text-muted">Ingresos totales estimados</h3>
                    <h1 class="mt-2" style="color:#6f7f5d;font-weight:700;">$<span
                            th:text="${#numbers.formatDecimal(ingresos,1,0)}"></span></h1>
                </div>
            </div>
            <div class="appointments-card">
                <div class="table-responsive">
                    <!-- ID AGREGADO: Identifica esta tabla en JavaScript -->
                    <table class="table" id="tablaIngresos">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Servicio</th>
                                <th>Precio</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cita : ${citas}">
                                <td th:text="${cita.user != null ? cita.user.name : 'N/A'}"></td>
                                <td th:text="${cita.service != null ? cita.service.name : 'N/A'}"></td>
                                <td>$<span
                                        th:text="${cita.service != null ? #numbers.formatDecimal(cita.service.price,1,0) : '0'}"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>

    <!-- SCRIPT AGREGADO: Procesa los datos y descarga el reporte -->
    <script>
        function exportarIngresosAExcel() {
            // Captura la tabla de ingresos mediante su identificador
            var tabla = document.getElementById('tablaIngresos');

            // Transforma el HTML físico a un formato comprensible por Excel
            var libro = XLSX.utils.table_to_book(tabla, { sheet: "Ingresos Estimados" });

            // Dispara la descarga con el nombre específico de este balance financiero
            XLSX.writeFile(libro, 'Reporte_Ingresos_Shalom.xlsx');
        }
    </script>
</body>

</html>
