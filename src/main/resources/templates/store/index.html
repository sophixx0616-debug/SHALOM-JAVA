<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Parisienne&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/shalom-reset.css" rel="stylesheet">
    <link href="/css/shalom.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{layouts/client-navbar :: clientNavbar('tienda')}"></nav>
<div th:replace="~{layouts/logout-modal :: logoutModal}"></div>
<main>
    <div th:replace="~{layouts/messages :: messages}"></div>

    <section class="page-hero">
        <i class="bi bi-shop deco-flower hf1"></i>
        <i class="bi bi-stars sparkle hs1"></i>
        <div class="container">
            <div class="fade-up">
                <span class="page-hero-eyebrow"><i class="bi bi-shop"></i> Belleza para llevar</span>
                <h1 class="mt-3">Tienda SHALOM</h1>
                <p class="page-hero-text">Productos y servicios Shalom para consentirte en casa y en el salón.</p>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="heading fade-up">
                <span class="script">Nuestros productos</span>
                <h2>Productos</h2>
                <div class="heading-divider"><i class="bi bi-flower2"></i></div>
            </div>
            <div class="row g-5">
                <div th:each="producto : ${productos}" class="col-sm-6 col-lg-4 col-xl-3">
                    <article class="service-card fade-up">
                        <div class="service-photo">
                            <img th:src="${producto.image != null ? producto.image : '/img/esmalte.jpg'}" alt="">
                        </div>
                        <div class="service-icon"><i class="bi bi-bag-heart"></i></div>
                        <div class="service-body">
                            <span class="service-cat-tag" th:text="${producto.brand != null ? producto.brand : 'Shalom'}">Shalom</span>
                            <h3 th:text="${producto.productName}">Producto</h3>
                            <div class="service-price" th:text="'$' + ${#numbers.formatDecimal(producto.price,1,0)}">$35.000</div>
                            <div class="d-flex flex-column gap-2 mt-3">
                                <form th:action="@{/carrito/anadir/{id}(id=${producto.id})}" method="post" class="w-100">
                                    <button type="submit" class="btn btn-primary-hero btn-sm-shalom w-100"
                                            th:disabled="${producto.stock <= 0}">
                                        <i th:class="${producto.stock > 0} ? 'bi bi-bag-plus' : 'bi bi-dash-circle'"></i>
                                        <span th:if="${producto.stock > 0}">Añadir al carrito</span>
                                        <span th:if="${producto.stock <= 0}">Sin stock</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </article>
                </div>
            </div>

            <hr class="heading-divider my-5">

            <div class="heading fade-up">
                <span class="script">Para tu próxima visita</span>
                <h2>Servicios</h2>
                <div class="heading-divider"><i class="bi bi-flower2"></i></div>
            </div>
            <div class="row g-5">
                <div th:each="servicio : ${servicios}" class="col-sm-6 col-lg-4">
                    <article class="service-card fade-up">
                        <div class="service-photo">
                            <img th:if="${servicio.image != null and !#strings.isEmpty(servicio.image)}" th:src="${servicio.image}" alt="">
                            <div th:unless="${servicio.image != null and !#strings.isEmpty(servicio.image)}"
                                 style="width:100%;height:100%;background:linear-gradient(135deg,#FFE5EE,#FFD0DF);display:flex;align-items:center;justify-content:center;">
                                <i class="bi bi-calendar-heart" style="font-size:3rem;color:#E94F87;opacity:.7;"></i>
                            </div>
                        </div>
                        <div class="service-icon"><i class="bi bi-calendar-heart"></i></div>
                        <div class="service-body">
                            <h3 th:text="${servicio.name}">Servicio</h3>
                            <p th:text="${servicio.description}">Descripción del servicio.</p>
                            <div class="service-price" th:text="'$' + ${#numbers.formatDecimal(servicio.price,1,0)}">$35.000</div>
                            <div class="d-flex flex-column gap-2 mt-3">
                                <form th:action="@{/carrito/anadir-servicio/{id}(id=${servicio.id})}" method="post" class="w-100">
                                    <button type="submit" class="btn btn-outline-hero btn-sm-shalom w-100">
                                        <i class="bi bi-calendar-plus"></i> Agendar
                                    </button>
                                </form>
                            </div>
                        </div>
                    </article>
                </div>
            </div>
        </div>
    </section>
</main>
<footer th:replace="~{layouts/shalom-footer :: shalomFooter}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shalom.js"></script>
</body>
</html>
