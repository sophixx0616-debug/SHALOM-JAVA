<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movimientos de Inventario — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Parisienne&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/shalom-reset.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<nav th:replace="~{layouts/navbar :: navbar}"></nav>
<main>
    <div th:replace="~{layouts/messages :: messages}"></div>
    <div class="container-lg py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title mb-0">
                <i class="bi bi-arrow-left-right"></i>
                Movimientos
                <span th:if="${product}" th:text="'— ' + ${product.productName}"></span>
            </h2>
            <a th:href="@{/inventory}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
        </div>

        <div class="card card-page p-4 mb-4">
            <h5 class="mb-3">Registrar movimiento</h5>
            <form th:action="${product} ? @{/inventory/{id}/movimientos(id=${product.id})} : @{/inventory/movimientos}" method="post">
                <div th:unless="${product}" class="mb-3">
                    <label class="form-label">Producto</label>
                    <select name="productId" class="form-select" required>
                        <option value="">Seleccionar producto...</option>
                        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.productName} + ' (Stock: ' + ${p.stock} + ')'"></option>
                    </select>
                </div>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Tipo</label>
                        <select name="type" class="form-select" required>
                            <option value="ENTRADA">Entrada</option>
                            <option value="SALIDA">Salida</option>
                            <option value="AJUSTE">Ajuste</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" min="0" name="quantity" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Razón</label>
                        <input type="text" name="reason" class="form-control" placeholder="Ej: Venta, reposición...">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-shalom-pink w-100"><i class="bi bi-check-lg"></i> Guardar</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="appointments-card">
            <div class="table-responsive">
                <table class="table">
                    <thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Stock Antes</th><th>Stock Después</th><th>Razón</th><th>Usuario</th></tr></thead>
                    <tbody>
                        <tr th:each="m : ${movements}">
                            <td th:text="${#temporals.format(m.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${m.product.productName}"></td>
                            <td>
                                <span class="badge bg-success" th:if="${m.type.name() == 'ENTRADA'}">Entrada</span>
                                <span class="badge bg-danger" th:if="${m.type.name() == 'SALIDA'}">Salida</span>
                                <span class="badge bg-warning text-dark" th:if="${m.type.name() == 'AJUSTE'}">Ajuste</span>
                            </td>
                            <td>
                                <span th:text="${m.quantity > 0 ? '+' + m.quantity : m.quantity}"></span>
                            </td>
                            <td th:text="${m.stockBefore}"></td>
                            <td th:text="${m.stockAfter}"></td>
                            <td th:text="${m.reason != null ? m.reason : '—'}"></td>
                            <td th:text="${m.user != null ? m.user.name : 'Sistema'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
