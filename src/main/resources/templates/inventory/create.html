<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo Producto — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Parisienne&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/shalom-reset.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{layouts/navbar :: navbar}"></nav>
<main>
    <div class="container-lg py-4">
        <div class="card card-page p-4">
            <h3 class="section-title"><i class="bi bi-box-seam"></i> Nuevo Producto</h3>
            <form th:action="@{/inventory}" method="post" th:object="${item}">
                <div class="mb-3">
                    <label class="form-label">Nombre del producto</label>
                    <input type="text" class="form-control" th:field="*{productName}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Marca</label>
                    <input type="text" class="form-control" th:field="*{brand}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Stock mínimo (alerta)</label>
                    <input type="number" min="0" class="form-control" th:field="*{minStock}" value="5">
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select class="form-select" th:field="*{category}" required>
                        <option value="Uñas">Uñas</option>
                        <option value="Cuidado">Cuidado</option>
                        <option value="Facial">Facial</option>
                        <option value="Manos">Manos</option>
                        <option value="Suministros">Suministros</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{price}" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-shalom-primary">Guardar</button>
                    <a th:href="@{/inventory}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
