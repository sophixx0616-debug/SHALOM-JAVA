<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Parisienne&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/shalom-reset.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<nav th:replace="~{layouts/navbar :: navbar}"></nav>
<main>
    <div th:replace="~{layouts/messages :: messages}"></div>
    <div class="container-lg py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title mb-0"><i class="bi bi-box-seam"></i> Inventario</h2>
            <a th:href="@{/inventory/create}" class="btn btn-shalom-pink"><i class="bi bi-plus-lg"></i> Nuevo Producto</a>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-4"><div class="card dashboard-card"><div class="card-body text-center"><h2 th:text="${totalProductos}"></h2><p>Total de productos</p></div></div></div>
            <div class="col-md-4"><div class="card dashboard-card"><div class="card-body text-center"><h2 th:text="${stockBajo}"></h2><p>Stock bajo</p></div></div></div>
            <div class="col-md-4"><div class="card dashboard-card"><div class="card-body text-center"><h2 th:text="${sinStock}"></h2><p>Sin stock</p></div></div></div>
        </div>

        <div class="appointments-card">
            <div class="table-responsive">
                <table class="table">
                    <thead><tr><th>Producto</th><th>Marca</th><th>Categoría</th><th>Stock</th><th>Precio</th><th>Acciones</th></tr></thead>
                    <tbody>
                        <tr th:each="item : ${items}">
                            <td th:text="${item.productName}"></td>
                            <td th:text="${item.brand != null ? item.brand : '—'}"></td>
                            <td th:text="${item.category}"></td>
                            <td>
                                <span class="badge-cancelada" th:if="${item.stock == 0}">Sin stock</span>
                                <span class="badge-pendiente" th:if="${item.stock > 0 and item.stock <= item.minStock}">Bajo</span>
                                <span class="badge-confirmada" th:if="${item.stock > item.minStock}" th:text="${item.stock}"></span>
                            </td>
                            <td>$<span th:text="${#numbers.formatDecimal(item.price,1,0)}"></span></td>
                            <td class="d-flex gap-2">
                                <a th:href="@{/inventory/{id}/movimientos(id=${item.id})}" class="btn btn-sm btn-outline-info" title="Movimientos"><i class="bi bi-arrow-left-right"></i></a>
                                <a th:href="@{/inventory/{id}/edit(id=${item.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{/inventory/{id}/delete(id=${item.id})}" method="post"
                                      onsubmit="return confirm('¿Eliminar este producto?')">
                                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                </form>
                                <form th:action="@{/carrito/anadir/{id}(id=${item.id})}" method="post">
                                    <button class="btn btn-sm btn-shalom-pink"><i class="bi bi-bag-plus"></i></button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
