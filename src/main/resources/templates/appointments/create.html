<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Cita — SHALOM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Parisienne&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shalom.css}" th:unless="${isAdmin}">
    <link rel="stylesheet" th:href="@{/css/app.css}" th:if="${isAdmin}">
</head>
<body>

<div th:unless="${isAdmin}">
    <nav th:replace="~{layouts/client-navbar :: clientNavbar('citas')}"></nav>
</div>
<div th:if="${isAdmin}">
    <nav th:replace="~{layouts/navbar :: navbar}"></nav>
</div>

<main>
    <div th:unless="${isAdmin}">
        <header class="page-hero page-hero-center fade-up">
            <i class="bi bi-calendar-heart deco-flower hf1"></i>
            <i class="bi bi-stars sparkle hs1"></i>
            <i class="bi bi-gem sparkle hs2"></i>
            <div class="container">
                <span class="page-hero-eyebrow"><i class="bi bi-calendar-heart"></i> Shalom Beauty Salon</span>
                <h1 class="mt-3">Nueva cita</h1>
                <p class="page-hero-text">Reserva el momento que mereces. Elige tu servicio, fecha y especialista.</p>
            </div>
        </header>

        <div th:replace="~{layouts/messages :: messages}"></div>

        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="data-card p-4 p-lg-5 fade-up">
                        <div class="text-center mb-4">
                            <div class="stat-icon mx-auto mb-3"><i class="bi bi-calendar-heart"></i></div>
                            <h3 class="mb-0">Reserva tu cita</h3>
                        </div>
                        <form th:action="@{/appointments}" method="post" id="appointmentForm">
                            <div class="row g-4">
                                <div class="col-md-12">
                                    <label class="form-label" for="serviceSel">Servicio</label>
                                    <select name="service_id" id="serviceSel" class="form-select" required>
                                        <option value="">Selecciona un servicio</option>
                                        <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="dateSel">Fecha</label>
                                    <input type="date" name="date" id="dateSel" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="timeSel">Hora</label>
                                    <input type="time" name="time" id="timeSel" class="form-control" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label" for="workerSel">Especialista</label>
                                    <select name="worker" id="workerSel" class="form-select">
                                        <option value="">Selecciona (opcional)</option>
                                        <option th:each="sp : ${specialists}" th:value="${sp.name}" th:text="${sp.name + ' — ' + sp.specialty}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="d-flex flex-column flex-sm-row gap-3 mt-4 align-items-stretch align-items-sm-center">
                                <button type="submit" class="btn btn-primary-hero flex-fill">
                                    <i class="bi bi-check-circle"></i> Reservar cita
                                </button>
                                <a th:href="@{/appointments}" class="btn btn-outline-hero flex-fill">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${isAdmin}">
        <div class="container-fluid p-4">
            <div th:replace="~{layouts/messages :: messages}"></div>
            <div class="card card-page p-4">
                <h3 class="section-title"><i class="bi bi-calendar-plus"></i> Reservar nueva cita</h3>
                <form th:action="@{/appointments}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Cliente</label>
                        <select name="user_id" class="form-select" required>
                            <option value="">Selecciona un cliente</option>
                            <option th:each="u : ${clients}" th:value="${u.id}" th:text="${u.name + ' ' + u.lastName + ' (' + u.email + ')'}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Servicio</label>
                        <select name="service_id" class="form-select" required>
                            <option value="">Selecciona un servicio</option>
                            <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" name="date" class="form-control" required th:attr="min=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Hora</label>
                        <input type="time" name="time" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Especialista</label>
                        <select name="worker" class="form-select">
                            <option value="">Selecciona (opcional)</option>
                            <option th:each="sp : ${specialists}" th:value="${sp.name}" th:text="${sp.name + ' — ' + sp.specialty}"></option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-shalom-primary">Reservar</button>
                        <a th:href="@{/appointments}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:unless="${isAdmin}">
    <footer th:replace="~{layouts/shalom-footer :: shalomFooter}"></footer>
    <div th:replace="~{layouts/logout-modal :: logoutModal}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shalom.js" th:unless="${isAdmin}"></script>
<script src="/js/app.js" th:if="${isAdmin}"></script>
</body>
</html>
