<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Cita — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Parisienne&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/shalom-reset.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<nav th:replace="~{layouts/navbar :: navbar}"></nav>
<main>
    <div th:replace="~{layouts/messages :: messages}"></div>
    <div class="container-lg py-4">
        <div class="card card-page p-4">
            <h3 class="section-title"><i class="bi bi-calendar-edit"></i> Editar cita</h3>
            <form th:action="@{/appointments/{id}(id=${appointment.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label">Servicio</label>
                    <select name="service_id" class="form-select" required>
                        <option th:each="s : ${services}" th:value="${s.id}"
                                th:text="${s.name}"
                                th:selected="${s.id == appointment.service.id}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fecha</label>
                    <input type="date" name="date" class="form-control"
                           th:value="${#temporals.format(appointment.date, 'yyyy-MM-dd')}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Hora</label>
                    <input type="time" name="time" class="form-control"
                           th:value="${#temporals.format(appointment.time, 'HH:mm')}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Especialista</label>
                    <select name="worker" class="form-select">
                        <option value="">Selecciona (opcional)</option>
                        <option th:each="sp : ${specialists}" th:value="${sp.name}"
                                th:text="${sp.name + ' — ' + sp.specialty}"
                                th:selected="${sp.name == appointment.worker}"></option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-shalom-primary">Guardar</button>
                    <a th:href="@{/appointments}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
