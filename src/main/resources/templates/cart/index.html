<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Bolsa — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Parisienne&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/shalom-reset.css" rel="stylesheet">
    <link href="/css/shalom.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<nav th:replace="~{layouts/client-navbar :: clientNavbar('carrito')}"></nav>
<div th:replace="~{layouts/logout-modal :: logoutModal}"></div>
<main>
    <div th:replace="~{layouts/messages :: messages}"></div>

    <section class="page-hero">
        <i class="bi bi-bag-heart deco-flower hf1"></i>
        <i class="bi bi-stars sparkle hs1"></i>
        <div class="container">
            <div class="fade-up">
                <span class="page-hero-eyebrow"><i class="bi bi-bag-heart"></i> Tu bolsa Shalom</span>
                <h1 class="mt-3">Mi Bolsa</h1>
                <p class="page-hero-text">Revisa los productos que has elegido para consentirte.</p>
            </div>
        </div>
    </section>

    <div class="container py-4">
        <th:block th:if="${#maps.isEmpty(cart)}">
            <div class="empty-state fade-up">
                <div class="empty-icon"><i class="bi bi-bag-heart"></i></div>
                <h4 class="empty-script">Aún no hay nada aquí</h4>
                <h4 class="mb-2">Tu bolsa está vacía</h4>
                <p>Explora nuestros servicios e inventario para añadir productos.</p>
                <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">
                    <a th:href="@{/tienda}" class="btn btn-primary-hero"><i class="bi bi-shop"></i> Ir a la tienda</a>
                    <a th:href="@{/services}" class="btn btn-outline-hero">Ver servicios</a>
                </div>
            </div>
        </th:block>

        <th:block th:unless="${#maps.isEmpty(cart)}">
            <div class="appointments-card fade-up">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th><th></th></tr></thead>
                        <tbody>
                            <tr th:each="entry : ${cart}">
                                <td th:text="${entry.value.name}"></td>
                                <td th:text="${entry.value.quantity}"></td>
                                <td>$<span th:text="${#numbers.formatDecimal(entry.value.price,1,0)}"></span></td>
                                <td>$<span th:text="${#numbers.formatDecimal(entry.value.price * entry.value.quantity,1,0)}"></span></td>
                                <td class="text-end">
                                    <form th:action="@{/carrito/eliminar/{id}(id=${entry.key})}" method="post">
                                        <button class="btn btn-sm btn-outline-danger" type="submit" title="Quitar"><i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-md-end gap-3 mt-4">
                    <h5 class="mb-0">Total: <span style="color:var(--fuchsia);font-family:'Playfair Display',serif;" th:text="'$' + ${#numbers.formatDecimal(total,1,0)}"></span></h5>
                    <div class="d-flex flex-column flex-sm-row gap-3">
                        <a th:href="@{/tienda}" class="btn btn-outline-hero"><i class="bi bi-arrow-left"></i> Seguir comprando</a>
                        <form th:action="@{/carrito/checkout}" method="post" onsubmit="return confirm('¿Confirmar compra?')">
                            <button type="submit" class="btn btn-primary-hero w-100"><i class="bi bi-check-circle"></i> Finalizar compra</button>
                        </form>
                    </div>
                </div>
            </div>
        </th:block>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/shalom.js"></script>
</body>
</html>
